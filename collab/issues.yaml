- key: G05-09
  title: "[B1] 索引、约束与外键策略（孤儿记录必须被拒）"
  role: B1
  milestone: M2
  labels: [type/feature, area/model, prio/P0]
  estimate: 8
  depends: [G05-08]
  goal: 让"数据不可能出错"由数据库保证，而不是靠代码自觉
  tasks:
    - 设备编号、测点编号加唯一约束
    - 测点→设备外键 ON DELETE CASCADE 或 RESTRICT（写明理由）
    - 开启 SQLite `PRAGMA foreign_keys=ON`（每连接都要设）
    - 高频查询路径补复合索引（device_id+is_deleted、point_type+is_deleted）
  acceptance:
    - 插入指向不存在设备的测点，报 FOREIGN KEY constraint failed
    - 重复编号插入报 UNIQUE constraint failed
    - "`EXPLAIN QUERY PLAN` 显示走索引而非全表扫描"
  files: [src/g05/models/, src/g05/core/db.py, tests/test_models.py]

