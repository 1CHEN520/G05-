# G05 任务拆分（唯一事实来源）
# scripts/create_issues.py 按本文件批量建 GitHub Issue（幂等，按标题去重）
# scripts/gen_collab_docs.py 按本文件生成 collab/issues.md（人工可读版）
#
# 字段说明：
#   key        编号，用于依赖引用与看板排序
#   role       责任角色（对应 roles.yaml）
#   milestone  M1~M4，对应 roles.yaml 的 milestones
#   estimate   预估工时（小时），用于排周计划
#   depends    前置 issue key，未完成不应开工
#   goal       一句话说清"这件事解决什么问题"
#   tasks      具体动作，会渲染成勾选清单
#   acceptance 验收口径，必须可观测、可复现

- key: G05-01
  title: "[A] 仓库骨架与分支保护规则"
  role: A
  milestone: M1
  labels: [type/feature, area/scaffold, prio/P0]
  estimate: 4
  depends: []
  goal: 让 9 个人第一天就能 clone 下来、装上、跑起来，而不是各写各的
  tasks:
    - 建空仓库 g05-asset-catalog，默认分支 main，开启 main 保护（禁止直推，必须 PR）
    - 落目录骨架：config / src/g05 / tests / scripts / docs / web / data
    - 提交 .gitignore（排除 *.db、logs、__pycache__、dist）与 .env.example
    - 写 README 的项目定位、四层环境说明、一条启动命令
    - 建立 4 个里程碑 M1~M4 与标签体系（type/ area/ prio/）
  acceptance:
    - 新人按 README 从零到 `python -m g05 preflight` 通过，不超过 30 分钟
    - main 分支无法直接 push（有保护规则截图）
    - "`git ls-files` 里没有 .db / 日志 / 缓存文件"
  files: [README.md, .gitignore, .env.example, Makefile, run.bat]

- key: G05-02
  title: "[A] 冻结接口契约：DTO、错误码、分页规范"
  role: A
  milestone: M1
  labels: [type/design, area/api, prio/P0]
  estimate: 6
  depends: [G05-01]
  goal: 前端、导入、血缘三方并行开发时，不用互相等对方改代码
  tasks:
    - 定义 DeviceIn/Out、PointIn/Out、AuditOut、ImportReport 等 Pydantic 模型
    - 统一分页响应结构 {items,total,page,size,pages}
    - 统一错误体 {code,message,detail}，错误码用 G05-1xxx（参数）/2xxx（业务）/5xxx（系统）
    - 把契约写进 docs/02-架构设计.md 的「接口契约」章节并评审通过
  acceptance:
    - /docs（Swagger）里每个端点都有入参、出参、错误码说明
    - 任何模块改动 DTO 必须走 PR 并由 A review
  files: [src/g05/schemas/dto.py, src/g05/api/deps.py, docs/02-架构设计.md]

- key: G05-03
  title: "[A] 配置外置与结构化日志落地"
  role: A
  milestone: M1
  labels: [type/feature, area/infra, prio/P0]
  estimate: 5
  depends: [G05-01]
  goal: 换台机器只改 YAML，不改代码；出问题能从日志里查出发生了什么
  tasks:
