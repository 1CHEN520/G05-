  acceptance:
    - grep 源码，业务逻辑里没有裸写的阈值常量
    - 改 config/rules.yaml 的阈值，重启后行为随之变化（附对照截图）
    - 日志文件每行可被 json.loads 解析
  files: [src/g05/core/config.py, src/g05/core/logging.py, config/]

- key: G05-04
  title: "[C6] 需求规格与用户故事"
  role: C6
  milestone: M1
  labels: [type/docs, area/spec, prio/P1]
  estimate: 6
  depends: [G05-02]
  goal: 把"要做什么"写成人能验收的话，避免后期扯皮
  tasks:
    - 梳理 12 条用户故事（角色/场景/价值/验收要点）
    - 写 16 条非功能需求，全部带数字（性能、容量、可用性、可维护性）
    - 补一张"需求—模块—负责人"追溯矩阵
  acceptance:
    - 每条需求都有可测量的验收口径（例如"万行导入 <30s"而非"导入要快"）
    - 追溯矩阵里每条需求至少映射到一个 issue
  files: [docs/01-需求规格.md]

- key: G05-05
  title: "[C5] 测试骨架与 CI 流水线"
  role: C5
  milestone: M1
  labels: [type/feature, area/qa, prio/P0]
  estimate: 6
  depends: [G05-01]
  goal: 每次 PR 自动跑测试，坏代码进不了 main
  tasks:
    - 搭 pytest 夹具：临时 SQLite + 建表 + 触发器，测试之间互不污染
    - 配置 pyproject 的 pytest/ruff/coverage 段
    - 写 GitHub Actions：装依赖 → ruff check → pytest -q → 覆盖率报告
    - PR 模板加"我跑了哪些验证"勾选项
  acceptance:
    - PR 页面能看到 CI 通过/失败的检查项
    - 故意提交一个失败用例，CI 变红（附截图）
    - 本地 `pytest -q` 与 CI 结果一致
  files: [tests/conftest.py, .github/workflows/ci.yml, .github/pull_request_template.md]

