# ============================================================
# 结构化日志配置（可观测铁律）
# 输出 JSON Lines，便于日志系统采集与 grep
# ============================================================

version: 1
disable_existing_loggers: false

formatters:
  # 生产：单行 JSON，字段固定，便于机器解析
  json:
    format: '{"ts":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","module":"%(module)s","line":%(lineno)d,"msg":"%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  # 开发：人眼可读
  console:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stderr

  file_json:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/app.jsonl
    maxBytes: 10485760        # 10MB 轮转
    backupCount: 5
    encoding: utf-8

  file_error:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: json
    filename: logs/error.jsonl
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  g05:
    level: DEBUG
    handlers: [console, file_json, file_error]
    propagate: false
  # 降噪：SQLAlchemy 的 SQL 回显只在 DEBUG 下
  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console, file_json]
    propagate: false

root:
  level: INFO
  handlers: [console, file_json, file_error]
