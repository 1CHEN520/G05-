[project]
name = "g05-asset-catalog"
version = "0.1.0"
description = "G05 设备台账与测点资产目录 —— 带血缘追踪与不可篡改审计的工业级资产目录"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "SQLAlchemy>=2.0.30,<2.1",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

# 命令行入口：装好后可直接用 g05 preflight / g05 serve
[project.scripts]
g05 = "g05.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------- pytest ----------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------- ruff ----------------
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

# ---------------- black（兼容配置，避免门禁默认 88 列误伤） ----------------
[tool.black]
line-length = 110
target-version = ["py310"]

# ---------------- coverage ----------------
[tool.coverage.run]
source = ["src/g05"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # 行长由 formatter 管
    "B008",   # FastAPI Depends 在默认参数里是标准写法
    "SIM108", # 三元表达式不一定更可读
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["E402"]   # 脚本需要先 sys.path.insert 再 import
